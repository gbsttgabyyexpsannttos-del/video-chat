<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>medo do desconhecidoggg</title></title>
</head>

<body>
  <h1>Boa Noite</h1>
  <p>Voce tem coragem...?</p>

  <button id="cameraBtn">deseja ver o video?</button>

  <br><br>

  <video id="video" autoplay playsinline width="300"></video>

  <script>
    const button = document.getElementById("cameraBtn");
    const video = document.getElementById("video");

    button.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
      } catch (error) {
        alert("Acesso à câmera não foi permitido.");
        console.error(error);
      }
    });
  </script>
</body>
</html>
