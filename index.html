<!DOCTYPE html>

<head>

<body>

  <h1>Hide you</h1>
  <p>M34o D0 0cUl70</p>

  <!-- CÂMERA -->
  <button id="cameraBtn">ver video?</button>

  <br><br>

  <video id="video" autoplay playsinline width="300"></video>

  <br><br>

  <!-- VÍDEO -->
  <h2>Lost Place..</h2>

  <video controls width="300">
    <source src="lost%20souls%20prayer%28720P_HD%29.mp4" type="video/mp4">
    Seu navegador não suporta vídeo.
  </video>

  <script>
    const button = document.getElementById("cameraBtn");
    const video = document.getElementById("video");

    button.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
      } catch (error) {
        alert("Acesso à câmera não foi permitido.");
        console.error(error);
      }
    });
  </script>

</body>
